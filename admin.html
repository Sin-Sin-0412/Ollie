<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ollie - 管理ダッシュボード</title>
    <link rel="stylesheet" href="./src/admin.css" />
  </head>
  <body>
    <header>
      <h1>⚙️ 管理ダッシュボード</h1>
      <button id="logout-btn" class="hidden">ログアウト</button>
    </header>

    <main>
      <div id="login-section">
        <h2>管理者ログイン</h2>
        <p>Supabaseに登録したアカウントでログインしてください。</p>
        <input type="email" id="admin-email" placeholder="メールアドレス" />
        <input type="password" id="admin-password" placeholder="パスワード" />
        <button id="login-btn">ログイン</button>
        <p id="login-error" class="error-msg"></p>
      </div>

      <div id="dashboard-section" class="hidden">
        <p>ここで各種設定を行います。</p>

        <div class="admin-card">
          <h3>NGワード管理</h3>
          <div class="input-group">
            <input
              type="text"
              id="new-ng-word"
              placeholder="追加するNGワード"
            />
            <button id="add-ng-btn">追加</button>
          </div>
          <ul id="ng-word-list"></ul>
        </div>

        <div class="admin-card">
          <h3>告知（ピン留め）管理</h3>
          <div class="input-group">
            <input
              type="text"
              id="announcement-input"
              placeholder="告知内容を入力"
            />
            <button id="update-announcement-btn">告知を更新</button>
          </div>
          <p id="current-announcement" style="font-size: 12px; color: #666">
            現在の告知: 読み込み中...
          </p>
        </div>

        <div class="admin-card">
          <h3>メッセージログ管理</h3>
          <p style="font-size: 12px; color: #666">
            ※最新の50件を表示しています
          </p>
          <div id="admin-messages-list"></div>
        </div>

      </div>
    </main>

    <script type="module" src="./src/admin.js"></script>
  </body>
</html>
